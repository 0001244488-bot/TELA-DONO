name: Build Windows Forms project

on:
  push:
    branches: [integracao-pets-donos]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore "TELA DONO.slnx"
      - name: Build
        run: dotnet build "TELA DONO.slnx" --no-restore --configuration Release
